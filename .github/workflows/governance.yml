name: PaySwap Governance

on:
  push:
  pull_request:

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate architecture
        run: python3 scripts/validate_architecture.py
      - name: Validate governance
        run: python3 scripts/validate_governance.py
