name: PaySwap Governance

on:
  push:
  pull_request:

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bind local main ref
        run: |
          if ! git show-ref --verify --quiet refs/heads/main; then
            git branch main origin/main
          fi
      - name: Validate architecture
        run: python3 scripts/validate_architecture.py
      - name: Validate governance
        run: python3 scripts/validate_governance.py
      - name: Install product shell dependencies
        run: python3 -m pip install -r app/requirements.txt
      - name: Verify product authentication shell
        run: python3 -m unittest app.test_auth
